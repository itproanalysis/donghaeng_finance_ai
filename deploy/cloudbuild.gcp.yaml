steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'Dockerfile.gcp', '-t', 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/donghaeng/app:$BUILD_ID', '.']
images:
  - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/donghaeng/app:$BUILD_ID'
timeout: 1200s
options:
  logging: CLOUD_LOGGING_ONLY
